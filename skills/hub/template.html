<title>Project Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: project buttons and a search box on top; below, the chosen project's pages on shelves. One page replaces the gallery. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --ink: #17232b; --muted: #5b6b75; --line: #d6dde1;
  --accent: #0b6b70; --accent-soft: #dcefee; --on-accent: #ffffff;
  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #10181c; --surface: #18232a; --ink: #e6edf0; --muted: #98a8b1; --line: #2c3a42; --accent: #5fc4c2; --accent-soft: #173538; --on-accent: #0c1a1c; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #10181c; --surface: #18232a; --ink: #e6edf0; --muted: #98a8b1; --line: #2c3a42; --accent: #5fc4c2; --accent-soft: #173538; --on-accent: #0c1a1c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; padding-block: 32px 64px; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 12.5px; font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
p { margin: 0; max-width: 66ch; }
.lede { color: var(--muted); margin-top: 6px; }
.controls { display: flex; flex-direction: column; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 10px; z-index: 2; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: baseline; gap: 6px; }
.chip small { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"] small { color: var(--on-accent); }
.search { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.search input { flex: 1 1 240px; min-width: 0; font: inherit; padding: 9px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.search span { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.project { display: flex; flex-direction: column; gap: 14px; }
.project > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.project > header span { color: var(--muted); font-size: 14px; }
.shelf { display: flex; flex-direction: column; gap: 8px; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 11px 16px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--accent-soft); }
.row b { font-family: var(--display); font-weight: 600; font-size: 16px; }
.row .what { grid-column: 1; color: var(--muted); font-size: 14px; }
.row .when { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; align-self: center; font-variant-numeric: tabular-nums; }
.note { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <h1>Project Hub</h1>
    <p class="lede">All your pages in one place, sorted by project. Pick a project, or search across everything. Each row opens that page in a new tab.</p>
  </header>

  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Project"></div>
    <div class="search">
      <input type="search" id="q" placeholder="Search every project" aria-label="Search pages">
      <span id="n"></span>
    </div>
  </div>

  <div id="out" style="display:flex;flex-direction:column;gap:36px"></div>

  <p class="note">This page is kept up to date by the artifact-hub plugin. Every page listed here stays private to you until you share it.</p>
</div>

<script>
(function () {
  var A = 'https://claude.ai/artifact/';
    // HUB-DATA-START — only this array changes; one entry per project
  var PROJECTS = [];
  // HUB-DATA-END

  var KEY = 'project-hub.project.v1';
  var chips = document.getElementById('chips'), out = document.getElementById('out'), q = document.getElementById('q'), n = document.getElementById('n');
  var current = 'all';
  // a bare #project-id in the link opens that project; otherwise the last one you chose
  var hash = (location.hash || '').replace('#', '');
  if (PROJECTS.some(function (p) { return p.id === hash; })) current = hash;
  else { try { var s = localStorage.getItem(KEY); if (s === 'all' || PROJECTS.some(function (p) { return p.id === s; })) current = s; } catch (e) { /* no storage: start on All */ } }

  function el(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text !== undefined) x.textContent = text; return x; }
  function count(p) { return p.shelves.reduce(function (t, s) { return t + s[1].length; }, 0); }
  var total = PROJECTS.reduce(function (t, p) { return t + count(p); }, 0);

  function chip(id, name, num) {
    var b = el('button', 'chip'); b.type = 'button'; b.id = 'chip-' + id;
    b.appendChild(document.createTextNode(name)); b.appendChild(el('small', '', String(num)));
    b.setAttribute('aria-pressed', String(current === id));
    b.addEventListener('click', function () { current = id; try { localStorage.setItem(KEY, id); } catch (e) { /* not saved */ } render(); });
    return b;
  }

  function render() {
    chips.textContent = '';
    chips.appendChild(chip('all', 'All projects', total));
    PROJECTS.forEach(function (p) { chips.appendChild(chip(p.id, p.name, count(p))); });
    var term = q.value.trim().toLowerCase(), shown = 0;
    out.textContent = '';
    PROJECTS.forEach(function (p) {
      // a search looks across every project; without one, only the chosen project shows
      if (!term && current !== 'all' && current !== p.id) return;
      var sec = el('section', 'project'), any = false;
      var head = el('header'); head.appendChild(el('h2', '', p.name)); if (p.about) head.appendChild(el('span', '', p.about));
      sec.appendChild(head);
      p.shelves.forEach(function (s) {
        var rows = el('div', 'rows'), has = false;
        s[1].forEach(function (pg) {
          if (term && (pg[0] + ' ' + pg[2] + ' ' + s[0] + ' ' + p.name).toLowerCase().indexOf(term) < 0) return;
          has = true; any = true; shown++;
          var a = el('a', 'row'); a.href = A + pg[1]; a.target = '_blank'; a.rel = 'noopener';
          a.appendChild(el('b', '', pg[0])); a.appendChild(el('span', 'when', pg[3])); a.appendChild(el('span', 'what', pg[2]));
          rows.appendChild(a);
        });
        if (!has) return;
        var shelf = el('div', 'shelf'); if (p.shelves.length > 1) shelf.appendChild(el('h3', '', s[0])); shelf.appendChild(rows); sec.appendChild(shelf);
      });
      if (any) out.appendChild(sec);
    });
    if (!shown) out.appendChild(el('p', 'note', total ? 'No page matches "' + q.value.trim() + '".' : 'No pages listed yet. Ask Claude to run the hub rebuild.'));
    n.textContent = term ? shown + ' of ' + total + ' pages, all projects' : shown + ' pages';
  }
  q.addEventListener('input', render);
  render();
})();
</script>
